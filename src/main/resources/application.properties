server.port=8080
spring.application.name=smartgpay

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartgpay
spring.datasource.username=postgres
spring.datasource.password=javeriya@2002
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GCP & Gemini Configuration
gcp.project-id=smartgpay
gcp.location=us-central1
gcp.credentials-path=src/main/resources/gcp-key.json
