# Disable Spring Cloud GCP Auto-Configurations for unit and integration tests
spring.cloud.gcp.alloydb.enabled=false
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.bigquery.enabled=false

# In-Memory H2 Configuration for Unit/DataJpa Tests
spring.datasource.url=jdbc:h2:mem:smartgpaytest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
